<script>
/* js_chat — Tahap 2: chat (pribadi & grup), halaman grup, notification center. */
(function () {
  var api = App.api, $ = App.$, $$ = App.$$;

  /* ---------- Ikon SVG bawaan (tidak bergantung CDN) — Material Icons, Apache 2.0 ---------- */
  var ICONS = {
    send: 'M2.01 21L23 12 2.01 3 2 10l15 2-15 2z',
    clip: 'M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 015 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 005 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z',
    back: 'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',

    info: 'M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z',
    check: 'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
    checks: 'M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z',
    clock: 'M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z',
    file: 'M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z',
    close: 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
    reply: 'M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z',
    trash: 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
    copy: 'M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z',
    download: 'M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z',
    pencil: 'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',
    people: 'M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z',
    down: 'M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z'
  };
  App.icon = function (name, size) {
    size = size || 18;
    return '<svg class="ic" viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="currentColor" aria-hidden="true"><path d="' + ICONS[name] + '"/></svg>';
  };
  var ic = App.icon;

  var FILE_EXT = ['jpg', 'jpeg', 'png', 'webp', 'pdf', 'docx', 'pptx', 'xlsx'];
  var ACCEPT = '.jpg,.jpeg,.png,.webp,.pdf,.docx,.pptx,.xlsx';

  /* ---------- Utilitas ---------- */
  var hm = function (iso) {
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  };
  var sameDay = function (a, b) { return a.toDateString() === b.toDateString(); };
  var dayLabel = function (iso) {
    var d = new Date(iso), now = new Date(), y = new Date(Date.now() - 86400000);
    if (sameDay(d, now)) return 'Hari ini';
    if (sameDay(d, y)) return 'Kemarin';
    return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  };
  var listTime = function (iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (sameDay(d, new Date())) return hm(iso);
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
  };
  /** Teks aman: di-escape dulu, lalu tautan http(s) dijadikan link. */
  var richText = App.richText;
  var b64toBlob = function (b64, mime) {
    var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
    for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  };
  var copyText = function (t) {
    var done = function () { App.toast('Disalin.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { App.toast('Gagal menyalin.', 'error'); }
      ta.remove();
    }
  };
  var convAvatar = function (c, size) {
    return App.avatar({ full_name: c.name, photo_file_id: c.photo_file_id, online: c.online }, size, c.type === 'direct', c.type === 'group');
  };

  App.openDirect = function (userId, btn) {
    if (btn) App.busy(btn, true);
    api('chat.openDirect', { userId: userId }).then(function (r) { App.go('chat/' + r.conv_id); })
      .catch(function (err) { if (btn) App.busy(btn, false); App.toast(err.message, 'error'); });
  };

  /* ---------- Gambar mini (thumbnail) lampiran ---------- */
  App.hydrateThumbs = function (root) {
    var imgs = $$('img[data-thumb]', root);
    var missing = [];
    imgs.forEach(function (img) {
      var id = img.dataset.thumb, url = App.thumbCache[id];
      if (url) img.src = url; else if (missing.indexOf(id) < 0) missing.push(id);
    });
    if (!missing.length) return;
    api('files.thumbs', { ids: missing.slice(0, 40) }).then(function (map) {
      Object.keys(map).forEach(function (k) { App.thumbCache[k] = map[k]; });
      $$('img[data-thumb]', root).forEach(function (img) {
        var u = App.thumbCache[img.dataset.thumb];
        if (u) img.src = u;
      });
    }).catch(function () {});
  };

  /** Buka lampiran: gambar & PDF ditampilkan, dokumen Office diunduh. */
  App.openAttachment = function (att) {
    var dlg = App.dialog({ title: att.name, wide: true, body: '<div class="empty"><span class="spinner"></span> Memuat file…</div>' });
    api('files.get', { id: att.id }).then(function (f) {
      var url = URL.createObjectURL(b64toBlob(f.data, f.mime));
      var dl = '<a class="btn btn-primary" href="' + url + '" download="' + esc(f.name) + '">' + ic('download') + ' Unduh</a>';
      var body;
      if (f.mime.indexOf('image/') === 0) body = '<img class="viewer-img" src="' + url + '" alt="' + esc(f.name) + '">';
      else if (f.mime === 'application/pdf') body = '<iframe class="viewer-pdf" src="' + url + '" title="' + esc(f.name) + '"></iframe>';
      else body = '<div class="empty">' + ic('file', 34) + '<p>' + esc(f.name) + '</p><p class="muted small">Dokumen ini tidak bisa ditampilkan di browser. Unduh untuk membukanya.</p></div>';
      $('.modal-body', dlg.el).innerHTML = body;
      var foot = document.createElement('div');
      foot.className = 'modal-foot';
      foot.innerHTML = dl;
      dlg.el.appendChild(foot);
    }).catch(function (err) {
      $('.modal-body', dlg.el).innerHTML = '<div class="alert alert-error" style="margin:0">' + esc(err.message) + '</div>';
    });
  };

  /** Perkecil gambar → JPEG. Mengembalikan { data: base64, thumb: dataUrl, name }. */
  function prepareImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject({ message: 'Gagal membaca gambar.' }); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject({ message: 'File bukan gambar yang valid.' }); };
        img.onload = function () {
          var draw = function (max, q) {
            var s = Math.min(1, max / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            var g = c.getContext('2d');
            g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
            g.drawImage(img, 0, 0, c.width, c.height);
            return c.toDataURL('image/jpeg', q);
          };
          var full = draw(1600, 0.85);
          var thumb = draw(360, 0.7);
          if (thumb.length > 45000) thumb = draw(240, 0.6);
          if (thumb.length > 45000) thumb = '';
          resolve({ data: full.split(',')[1], thumb: thumb, name: file.name.replace(/\.[^.]+$/, '') + '.jpg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /** Siapkan file untuk diunggah: gambar diperkecil, file lain dibaca apa adanya. Dipakai chat, forum, materi. */
  App.prepareFile = function (file) {
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    if (FILE_EXT.indexOf(ext) < 0) return Promise.reject({ message: file.name + ': jenis file tidak diizinkan.' });
    var isImg = ['jpg', 'jpeg', 'png', 'webp'].indexOf(ext) >= 0;
    if (file.size > (isImg ? 15 : 5) * 1024 * 1024) return Promise.reject({ message: file.name + ': ukuran maksimal 5 MB.' });
    return (isImg ? prepareImage(file) : readBase64(file).then(function (b) { return { data: b, thumb: '', name: file.name }; }))
      .then(function (p) {
        if (p.data.length > 5 * 1024 * 1024 * 4 / 3) throw { message: file.name + ': ukuran maksimal 5 MB.' };
        p.isImg = isImg;
        return p;
      });
  };
  App.FILE_ACCEPT = ACCEPT;

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject({ message: 'Gagal membaca file.' }); };
      reader.onload = function () { resolve(String(reader.result).split(',')[1] || ''); };
      reader.readAsDataURL(file);
    });
  }

  /* =================== Halaman Chat =================== */
  var st = null;   // keadaan percakapan yang sedang dibuka

  App.onInbox = function () {
    if ($('#c-items')) renderList();
  };

  function viewChat(main, r) {
    var convId = r.parts[1] || '';
    main.innerHTML = '<div class="chat-layout' + (convId ? ' has-conv' : '') + '">' +
      '<section class="chat-list card"><div class="chat-list-head"><h2>Percakapan</h2><span style="flex:1"></span>' +
      '<button class="btn btn-ghost btn-icon btn-sm" id="c-search" title="Cari pesan">' + ic('search') + '</button>' +
      '<button class="btn btn-primary btn-sm" id="c-new" title="Chat baru">' + ic('pencil', 16) + ' Baru</button></div>' +
      '<div class="chat-filter"><input class="input" id="c-filter" placeholder="Cari percakapan"></div>' +
      '<div class="conv-items" id="c-items"></div></section>' +
      '<section class="chat-thread card" id="c-thread">' + emptyThread() + '</section></div>';
    $('#c-filter').oninput = renderList;
    $('#c-new').onclick = newChatDialog;
    $('#c-search').onclick = function () { searchDialog(null); };
    renderList();
    if (convId) openThread(convId);
    else { App.chat = null; st = null; }
  }

  function emptyThread() {
    return '<div class="thread-empty"><div class="soon-box" style="padding:0">' + App.logo(56) +
      '<h2 style="margin:16px 0 6px">Pilih percakapan</h2><p class="muted" style="margin:0">' + esc(App.boot.tagline || '') +
      '</p></div></div>';
  }

  function renderList() {
    var box = $('#c-items');
    if (!box) return;
    if (!App.syncState.booted) {
      box.innerHTML = '<div style="padding:12px">' + new Array(5).join('<div class="skeleton" style="height:56px;margin-bottom:8px"></div>') + '</div>';
      return;
    }
    var q = ($('#c-filter').value || '').toLowerCase();
    var items = App.inbox.items.filter(function (c) { return !q || c.name.toLowerCase().indexOf(q) >= 0; });
    var active = st && st.convId;
    box.innerHTML = items.length ? items.map(function (c) {
      return '<a class="conv-item' + (c.conv_id === active ? ' active' : '') + (c.unread ? ' unread' : '') + '" data-conv="' + esc(c.conv_id) + '">' +
        convAvatar(c, 44) + '<div class="meta"><div class="r1"><span class="name">' + esc(c.name) + '</span>' +
        (c.is_official ? '<span class="chip chip-blue" style="padding:1px 6px">Resmi</span>' : '') +
        (c.muted ? '<span class="muted-ic" title="Dibisukan">🔕</span>' : '') +
        '<span class="time">' + esc(listTime(c.last_message_at || c.created_at)) + '</span></div>' +
        '<div class="r2"><span class="preview">' + esc(c.preview || (c.type === 'group' ? c.member_count + ' anggota' : 'Belum ada pesan')) + '</span>' +
        (c.unread ? '<b class="badge' + (c.muted ? ' quiet' : '') + '">' + (c.unread > 99 ? '99+' : c.unread) + '</b>' : '') + '</div></div></a>';
    }).join('') : '<div class="empty">' + ic('people', 26) + '<p>' + (q ? 'Tidak ada percakapan yang cocok.' :
      'Belum ada percakapan.<br>Mulai chat dengan tombol <b>Baru</b>, atau gabung ke grup.') + '</p>' +
      (q ? '' : '<a class="btn btn-sm" data-go-groups>Lihat grup</a>') + '</div>';
    $$('[data-conv]', box).forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); App.go('chat/' + a.dataset.conv); };
    });
    var g = $('[data-go-groups]', box);
    if (g) g.onclick = function () { App.go('groups'); };
    App.hydrateAvatars(box);
  }

  /* ---------- Percakapan terbuka ---------- */
  function openThread(convId) {
    var thread = $('#c-thread');
    document.body.classList.add('in-thread');
    st = { convId: convId, conv: null, messages: [], senders: {}, reads: {}, online: {}, hasMore: false,
      reply: null, uploads: [], seq: 0 };
    thread.innerHTML = '<div style="padding:18px"><div class="skeleton" style="height:44px;margin-bottom:16px"></div>' +
      '<div class="skeleton" style="height:260px"></div></div>';
    api('chat.open', { convId: convId }).then(function (d) {
      if (!st || st.convId !== convId) return;
      st.conv = d.conv; st.messages = d.messages; st.senders = d.senders; st.reads = d.reads; st.hasMore = d.hasMore;
      d.conv.members.forEach(function (m) { st.online[m.user_id] = m.online; });
      App.chat = { convId: convId, cv: d.cv, rv: d.rv, onConv: onConv, onReads: onReads, onPresence: onPresence, onRemoved: onRemoved };
      renderThread();
      renderMessages('bottom');
      renderList();
      App.syncNow();
    }).catch(function (err) {
      thread.innerHTML = '<div style="padding:20px"><div class="alert alert-error">' + esc(err.message) + '</div>' +
        '<a class="btn" data-back>' + ic('back', 16) + ' Kembali</a></div>';
      $('[data-back]', thread).onclick = function () { App.go('chat'); };
      App.chat = null;
    });
  }

  function subtitle() {
    var c = st.conv;
    if (c.type === 'direct') {
      var p = c.peer || {};
      if (p.active === false) return 'Akun tidak aktif';
      return st.online[p.user_id] ? '<span class="online-text">Online</span>' : 'Terakhir aktif ' + esc(App.timeAgo(p.last_seen_at));
    }
    var on = c.members.filter(function (m) { return st.online[m.user_id]; }).length;
    return c.members.length + ' anggota · ' + on + ' online';
  }

  function renderThread() {
    var c = st.conv, thread = $('#c-thread');
    thread.innerHTML =
      '<div class="thread-head">' +
      '<button class="btn btn-ghost btn-icon back" id="t-back" title="Kembali">' + ic('back') + '</button>' +
      '<span id="t-avatar">' + convAvatar({ type: c.type, name: c.name, photo_file_id: c.photo_file_id, online: c.peer && st.online[c.peer.user_id] }, 40) + '</span>' +
      '<div class="meta"><div class="name">' + esc(c.name) + (c.is_official ? ' <span class="chip chip-blue">Resmi</span>' : '') + '</div>' +
      '<div class="sub" id="t-sub">' + subtitle() + '</div></div>' +
      '<button class="btn btn-ghost btn-icon" id="t-search" title="Cari di percakapan ini">' + ic('search') + '</button>' +
      '<button class="btn btn-ghost btn-icon" id="t-info" title="Info">' + ic('info') + '</button></div>' +
      '<div class="thread-body" id="t-body"><div class="load-more" id="t-more-wrap"></div><div id="t-msgs"></div></div>' +
      '<button class="new-pill hidden" id="t-pill">' + ic('down', 16) + ' Pesan baru</button>' +
      '<form class="composer" id="t-form" autocomplete="off">' +
      '<div class="reply-bar hidden" id="t-reply"></div><div class="att-bar hidden" id="t-atts"></div>' +
      '<div class="composer-row"><label class="btn btn-ghost btn-icon" title="Lampirkan file (JPG, PNG, WEBP, PDF, DOCX, PPTX, XLSX — maks. 5 MB)">' + ic('clip', 20) +
      '<input type="file" id="t-file" multiple accept="' + ACCEPT + '" hidden></label>' +
      '<textarea class="input" id="t-input" rows="1" maxlength="2000" placeholder="Tulis pesan…"></textarea>' +
      '<button class="btn btn-primary btn-icon" type="submit" id="t-send" title="Kirim">' + ic('send') + '</button></div></form>';

    $('#t-back').onclick = function () { App.go('chat'); };
    $('#t-info').onclick = infoDialog;
    $('#t-search').onclick = function () { searchDialog(st.convId); };
    var body = $('#t-body');
    body.addEventListener('scroll', function () {
      if (nearBottom()) $('#t-pill').classList.add('hidden');
    });
    $('#t-pill').onclick = function () { body.scrollTop = body.scrollHeight; this.classList.add('hidden'); };
    $('#t-msgs').addEventListener('click', onMessageClick);
    var input = $('#t-input');
    input.addEventListener('input', autosize);
    input.addEventListener('keydown', function (e) {
      var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !touch) { e.preventDefault(); send(); }
    });
    $('#t-form').onsubmit = function (e) { e.preventDefault(); send(); };
    $('#t-file').onchange = function () { addFiles(this.files); this.value = ''; };
    App.hydrateAvatars($('.thread-head'));
    if (!window.matchMedia('(pointer: coarse)').matches) input.focus();
  }

  function autosize() {
    var t = $('#t-input');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight + 2, 140) + 'px';
  }

  function nearBottom() {
    var b = $('#t-body');
    return !b || b.scrollHeight - b.scrollTop - b.clientHeight < 140;
  }

  function senderName(id) {
    if (id === App.me.user_id) return 'Anda';
    var s = st.senders[id];
    return s ? s.full_name : 'Pengguna';
  }

  function tick(m) {
    if (m.pending) return '<span class="tick" title="Mengirim">' + ic('clock', 13) + '</span>';
    if (m.failed) return '';
    var others = st.conv.members.filter(function (x) { return x.user_id !== App.me.user_id; });
    var read = others.filter(function (x) { return (st.reads[x.user_id] || '') >= m.id; }).length;
    if (!others.length || !read) return '<span class="tick" title="Terkirim">' + ic('check', 14) + '</span>';
    var all = read === others.length;
    var title = st.conv.type === 'direct' ? 'Dibaca' : 'Dibaca ' + read + ' dari ' + others.length + ' anggota';
    return '<span class="tick' + (all ? ' read' : '') + '" title="' + title + '">' + ic('checks', 15) + '</span>';
  }

  function attachmentsHtml(list) {
    return list.map(function (a) {
      var data = esc(JSON.stringify({ id: a.id, name: a.name, mime: a.mime }));
      if (a.kind === 'image' && a.thumb) {
        return '<button type="button" class="att-img" data-att="' + data + '"><img data-thumb="' + esc(a.id) + '" alt="' + esc(a.name) + '"></button>';
      }
      return '<button type="button" class="att-file" data-att="' + data + '">' + ic('file', 22) + '<span><b>' + esc(a.name) +
        '</b><small>' + esc(App.fmtSize(a.size || 0)) + ' · ' + esc((a.name.split('.').pop() || '').toUpperCase()) + '</small></span></button>';
    }).join('');
  }

  function renderMessages(mode) {
    var box = $('#t-msgs'), body = $('#t-body');
    if (!box) return;
    var wasNear = nearBottom();
    var prevHeight = body.scrollHeight, prevTop = body.scrollTop;
    var me = App.me.user_id, isGroup = st.conv.type === 'group';
    var html = '', lastDay = '', prev = null;

    st.messages.forEach(function (m) {
      var d = new Date(m.created_at), dk = d.toDateString();
      if (dk !== lastDay) { html += '<div class="day-sep"><span>' + esc(dayLabel(m.created_at)) + '</span></div>'; lastDay = dk; prev = null; }
      if (m.kind === 'system') {
        html += '<div class="msg system"><span class="sys">' + esc(m.body) + '</span></div>';
        prev = null; return;
      }
      var mine = m.sender_id === me;
      var cont = prev && prev.sender_id === m.sender_id && prev.kind !== 'system' && (d - new Date(prev.created_at) < 5 * 60000);
      var showHead = isGroup && !mine && !cont;
      var inner = '';
      if (m.deleted) {
        inner = '<span class="deleted-text">Pesan ini telah dihapus</span>';
      } else {
        if (m.reply) inner += '<div class="quote"><b>' + esc(m.reply.sender_id === me ? 'Anda' : m.reply.name) + '</b><span>' + esc(m.reply.text) + '</span></div>';
        if (m.attachments && m.attachments.length) inner += '<div class="atts">' + attachmentsHtml(m.attachments) + '</div>';
        if (m.body) inner += '<div class="text">' + richText(m.body) + '</div>';
      }
      inner += '<span class="meta-line">' + esc(hm(m.created_at)) + (mine ? tick(m) : '') + '</span>';
      var actions = '';
      if (!m.deleted && !m.pending) {
        if (m.failed) actions = '<button type="button" data-act="retry">Coba lagi</button><button type="button" data-act="discard">Buang</button>';
        else {
          actions = '<button type="button" data-act="reply">' + ic('reply', 14) + ' Balas</button>';
          if (m.body) actions += '<button type="button" data-act="copy">' + ic('copy', 14) + ' Salin</button>';
          if (mine) actions += '<button type="button" data-act="delete" class="danger">' + ic('trash', 14) + ' Hapus</button>';
          else actions += '<button type="button" data-act="report">Laporkan</button>';
        }
      }
      html += '<div class="msg' + (mine ? ' mine' : '') + (cont ? ' cont' : '') + (m.deleted ? ' deleted' : '') + (m.failed ? ' failed' : '') +
        '" data-id="' + esc(m.id) + '">' +
        (isGroup && !mine ? (cont ? '<span class="av-space"></span>' : App.avatar({ full_name: senderName(m.sender_id), photo_file_id: (st.senders[m.sender_id] || {}).photo_file_id }, 30)) : '') +
        '<div class="msg-col">' + (showHead ? '<div class="sender">' + esc(senderName(m.sender_id)) + '</div>' : '') +
        '<div class="bubble">' + inner + '</div>' +
        (m.failed ? '<div class="fail-note">Gagal terkirim' + (m.error ? ': ' + esc(m.error) : '') + '</div>' : '') +
        (actions ? '<div class="msg-actions">' + actions + '</div>' : '') + '</div></div>';
      prev = m;
    });
    if (!st.messages.length) html = '<div class="empty" style="margin-top:40px">' + ic('send', 26) + '<p>Belum ada pesan. Sapa duluan!</p></div>';
    box.innerHTML = html;

    $('#t-more-wrap').innerHTML = st.hasMore ? '<button type="button" class="btn btn-sm" id="t-more">Muat pesan sebelumnya</button>' : '';
    var more = $('#t-more');
    if (more) more.onclick = loadOlder;

    if (mode === 'bottom' || (mode !== 'prepend' && wasNear)) body.scrollTop = body.scrollHeight;
    else if (mode === 'prepend') body.scrollTop = prevTop + (body.scrollHeight - prevHeight);
    else if (mode === 'incoming') $('#t-pill').classList.remove('hidden');
    else body.scrollTop = prevTop;
    App.hydrateAvatars(box);
    App.hydrateThumbs(box);
    $$('img[data-thumb]', box).forEach(function (img) {
      img.onload = function () { if (mode !== 'prepend' && wasNear) body.scrollTop = body.scrollHeight; };
    });
  }

  function onConv(c) {
    if (!st || st.convId !== c.conv_id) return;
    App.chat.cv = c.cv;
    Object.keys(c.senders).forEach(function (k) { st.senders[k] = c.senders[k]; });
    var win = c.messages;
    var firstId = win.length ? win[0].id : null;
    var older = st.messages.filter(function (m) { return !m.temp && firstId && m.id < firstId; });
    var temps = st.messages.filter(function (m) { return m.temp; }).filter(function (t) {
      // pesan sementara dibuang bila salinan server-nya sudah tiba
      return !win.some(function (m) { return m.id === t.serverId; });
    });
    var before = st.messages.filter(function (m) { return !m.temp; });
    var lastBefore = before.length ? before[before.length - 1].id : '';
    var incoming = win.some(function (m) { return m.id > lastBefore && m.sender_id !== App.me.user_id; });
    st.messages = older.concat(win, temps);
    renderMessages(incoming && !nearBottom() ? 'incoming' : 'auto');
    if (win.some(function (m) { return m.kind === 'system' && m.id > lastBefore; })) refreshMeta();
  }

  function onReads(r) {
    if (!st) return;
    App.chat.rv = r.rv;
    st.reads = r.map;
    $$('.msg.mine', $('#t-msgs')).forEach(function (el) {
      var m = st.messages.filter(function (x) { return x.id === el.dataset.id; })[0];
      var t = el.querySelector('.tick');
      if (m && t && !m.pending) t.outerHTML = tick(m);
    });
  }

  function onPresence(map) {
    if (!st || !st.conv) return;
    st.online = map;
    var sub = $('#t-sub');
    if (sub) sub.innerHTML = subtitle();
    var av = $('#t-avatar');
    if (av && st.conv.type === 'direct' && st.conv.peer) {
      var dot = av.querySelector('.dot'), on = !!map[st.conv.peer.user_id];
      if (on && !dot) av.querySelector('.avatar').insertAdjacentHTML('beforeend', '<span class="dot"></span>');
      if (!on && dot) dot.remove();
    }
  }

  function onRemoved() {
    App.toast('Anda tidak lagi menjadi anggota percakapan ini.', 'error');
    App.chat = null; st = null;
    App.go('chat');
  }

  /** Muat ulang info percakapan. Dialog info dibuka lagi bila diminta, atau bila sedang terbuka. */
  function refreshMeta(reopenInfo) {
    if (!st) return;
    var infoVisible = !!document.querySelector('#modal-root .ginfo-head');
    var id = st.convId;
    api('chat.open', { convId: id }).then(function (d) {
      if (!st || st.convId !== id) return;
      st.conv = d.conv;
      d.conv.members.forEach(function (m) { st.online[m.user_id] = m.online; });
      var head = $('.thread-head');
      if (head) {
        head.querySelector('.name').innerHTML = esc(d.conv.name) + (d.conv.is_official ? ' <span class="chip chip-blue">Resmi</span>' : '');
        $('#t-sub').innerHTML = subtitle();
        $('#t-avatar').innerHTML = convAvatar({ type: d.conv.type, name: d.conv.name, photo_file_id: d.conv.photo_file_id }, 40);
        App.hydrateAvatars(head);
      }
      if (reopenInfo || infoVisible) infoDialog();
    }).catch(function () {});
  }

  function loadOlder() {
    var first = st.messages.filter(function (m) { return !m.temp; })[0];
    if (!first) return;
    var btn = $('#t-more');
    App.busy(btn, true);
    api('chat.history', { convId: st.convId, beforeId: first.id }).then(function (d) {
      Object.keys(d.senders).forEach(function (k) { st.senders[k] = d.senders[k]; });
      st.messages = d.messages.concat(st.messages);
      st.hasMore = d.hasMore;
      renderMessages('prepend');
    }).catch(function (err) { App.busy(btn, false); App.toast(err.message, 'error'); });
  }

  /* ---------- Aksi pesan ---------- */
  function onMessageClick(e) {
    var att = e.target.closest('[data-att]');
    if (att) { App.openAttachment(JSON.parse(att.dataset.att)); return; }
    if (e.target.closest('a')) return;
    var actBtn = e.target.closest('[data-act]');
    var row = e.target.closest('.msg[data-id]');
    if (!row) return;
    var m = st.messages.filter(function (x) { return x.id === row.dataset.id; })[0];
    if (!m) return;
    if (actBtn) {
      var act = actBtn.dataset.act;
      row.classList.remove('act');
      if (act === 'reply') setReply(m);
      if (act === 'copy') copyText(m.body);
      if (act === 'delete') confirmDelete(m);
      if (act === 'report') App.report('message', m.id, 'pesan dari ' + senderName(m.sender_id));
      if (act === 'retry') { st.messages = st.messages.filter(function (x) { return x !== m; }); doSend(m.body, m.reply, m.attachments); }
      if (act === 'discard') { st.messages = st.messages.filter(function (x) { return x !== m; }); renderMessages('auto'); }
      return;
    }
    if (e.target.closest('.bubble')) {
      var on = row.classList.contains('act');
      $$('.msg.act', $('#t-msgs')).forEach(function (x) { x.classList.remove('act'); });
      if (!on) row.classList.add('act');
    }
  }

  function setReply(m) {
    var text = m.body || (m.attachments.length ? (m.attachments[0].kind === 'image' ? 'Foto' : 'File: ' + m.attachments[0].name) : '');
    st.reply = { id: m.id, sender_id: m.sender_id, name: senderName(m.sender_id), text: text.length > 80 ? text.slice(0, 77) + '…' : text };
    var bar = $('#t-reply');
    bar.innerHTML = ic('reply', 16) + '<div class="rb-text"><b>Membalas ' + esc(st.reply.name) + '</b><span>' + esc(st.reply.text) + '</span></div>' +
      '<button type="button" class="btn btn-ghost btn-icon btn-sm" id="t-reply-x" title="Batal">' + ic('close', 16) + '</button>';
    bar.classList.remove('hidden');
    $('#t-reply-x').onclick = clearReply;
    $('#t-input').focus();
  }

  function clearReply() {
    st.reply = null;
    var bar = $('#t-reply');
    if (bar) { bar.classList.add('hidden'); bar.innerHTML = ''; }
  }

  function confirmDelete(m) {
    App.modal({
      title: 'Hapus pesan?',
      body: '<p style="margin:0">Pesan akan diganti dengan tulisan "Pesan ini telah dihapus" untuk semua anggota. Lampirannya ikut dihapus.</p>',
      confirm: 'Hapus',
      onConfirm: function () {
        return api('chat.deleteMessage', { msgId: m.id }).then(function () {
          m.deleted = true; m.body = ''; m.attachments = []; m.reply = null;
          renderMessages('auto');
        });
      }
    });
  }

  /* ---------- Kirim ---------- */
  function send() {
    var input = $('#t-input');
    var body = input.value.trim();
    if (st.uploads.some(function (u) { return u.status === 'uploading'; })) {
      App.toast('Tunggu sampai semua file selesai diunggah.'); return;
    }
    var ready = st.uploads.filter(function (u) { return u.status === 'done'; }).map(function (u) { return u.meta; });
    if (!body && !ready.length) return;
    if (body.length > 2000) { App.toast('Pesan maksimal 2000 karakter.', 'error'); return; }
    input.value = ''; autosize();
    var reply = st.reply;
    clearReply();
    st.uploads = []; renderUploads();
    doSend(body, reply, ready);
    input.focus();
  }

  function doSend(body, reply, attachments) {
    var convId = st.convId;
    var temp = { id: 'zz_tmp_' + (++st.seq), temp: true, pending: true, sender_id: App.me.user_id, kind: 'text', body: body,
      reply: reply, attachments: attachments || [], created_at: new Date().toISOString(), deleted: false };
    st.messages.push(temp);
    renderMessages('bottom');
    api('chat.send', {
      convId: convId, body: body, replyToId: reply ? reply.id : '',
      attachmentIds: (attachments || []).map(function (a) { return a.id; })
    }).then(function (res) {
      if (!st || st.convId !== convId) return;
      temp.serverId = res.message.id;
      var exists = st.messages.some(function (m) { return m.id === res.message.id; });
      var i = st.messages.indexOf(temp);
      if (i >= 0) {
        if (exists) st.messages.splice(i, 1);
        else st.messages[i] = res.message;
      }
      st.reads[App.me.user_id] = res.message.id;
      renderMessages('auto');
    }).catch(function (err) {
      temp.pending = false; temp.failed = true; temp.error = err.message;
      if (st && st.convId === convId) renderMessages('auto');
      App.toast(err.message, 'error');
    });
  }

  /* ---------- Lampiran ---------- */
  function addFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    files.forEach(function (file) {
      if (st.uploads.length >= 5) { App.toast('Maksimal 5 lampiran per pesan.'); return; }
      var ext = (file.name.split('.').pop() || '').toLowerCase();
      if (FILE_EXT.indexOf(ext) < 0) { App.toast(file.name + ': jenis file tidak diizinkan.', 'error'); return; }
      var isImg = ['jpg', 'jpeg', 'png', 'webp'].indexOf(ext) >= 0;
      if (file.size > (isImg ? 15 : 5) * 1024 * 1024) { App.toast(file.name + ': ukuran maksimal 5 MB.', 'error'); return; }
      var u = { key: 'u' + (++st.seq), name: file.name, status: 'uploading', isImg: isImg };
      st.uploads.push(u);
      renderUploads();
      var convId = st.convId;
      (isImg ? prepareImage(file) : readBase64(file).then(function (b) { return { data: b, thumb: '', name: file.name }; }))
        .then(function (p) {
          if (p.data.length > 5 * 1024 * 1024 * 4 / 3) throw { message: 'Ukuran maksimal 5 MB.' };
          u.preview = p.thumb;
          renderUploads();
          return api('files.upload', { convId: convId, name: p.name, data: p.data, thumb: p.thumb });
        })
        .then(function (meta) {
          u.status = 'done'; u.meta = meta; u.name = meta.name;
          if (u.preview) App.thumbCache[meta.id] = u.preview;
          renderUploads();
        })
        .catch(function (err) {
          u.status = 'error'; u.error = err.message || 'Gagal mengunggah.';
          renderUploads();
        });
    });
  }

  function renderUploads() {
    var bar = $('#t-atts');
    if (!bar) return;
    bar.classList.toggle('hidden', !st.uploads.length);
    bar.innerHTML = st.uploads.map(function (u) {
      return '<span class="up-chip ' + u.status + '" title="' + esc(u.error || u.name) + '">' +
        (u.preview ? '<img src="' + u.preview + '" alt="">' : ic('file', 18)) +
        '<span class="up-name">' + esc(u.name) + '</span>' +
        (u.status === 'uploading' ? '<span class="spinner"></span>' : '') +
        (u.status === 'error' ? '<span class="up-err">Gagal</span>' : '') +
        '<button type="button" data-rm="' + u.key + '" title="Hapus">' + ic('close', 14) + '</button></span>';
    }).join('');
    $$('[data-rm]', bar).forEach(function (b) {
      b.onclick = function () {
        st.uploads = st.uploads.filter(function (u) { return u.key !== b.dataset.rm; });
        renderUploads();
      };
    });
  }

  /* ---------- Dialog: pencarian ---------- */
  function searchDialog(convId) {
    var dlg = App.dialog({
      title: convId ? 'Cari di percakapan ini' : 'Cari pesan',
      body: '<input class="input" id="sr-q" placeholder="Ketik minimal 2 huruf">' +
        '<div class="pick-list" id="sr-list"><div class="empty small">Hasil pencarian tampil di sini.</div></div>'
    });
    var t = null;
    $('#sr-q').focus();
    $('#sr-q').oninput = function () {

        var box = $('#sr-list');

          var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');

              '</small><span class="hit">' + esc(h.body).replace(re, '<mark>$1</mark>') + '</span></span></button>';
          }).join('') : '<div class="empty small">Tidak ada pesan yang cocok.</div>';

              else if (!st || st.convId !== b.dataset.conv) App.go('chat/' + b.dataset.conv);
              else App.toast('Pesan ada di riwayat lama. Klik "Muat pesan sebelumnya".');
            };

        }).catch(function (err) { box.innerHTML = '<div class="alert alert-error">' + esc(err.message) + '</div>'; });
      }, 400);
    };
  }

          body: '<p style="margin:0">' + esc(target.full_name) + ' akan menjadi pemilik grup. Anda menjadi admin grup.</p>',
          onConfirm: function () {
            return api('groups.setMemberRole', { convId: c.conv_id, userId: target.user_id, role: 'owner' })
              .then(function () { after('Kepemilikan diserahkan.'); });
          } });
      };
    });
    $$('[data-kick]', dlg.el).forEach(function (b) {
      b.onclick = function () {
        var target = c.members.filter(function (m) { return m.user_id === b.dataset.kick; })[0];
        App.modal({ title: 'Keluarkan ' + target.full_name + '?', confirm: 'Keluarkan',
          body: '<p style="margin:0">Ia tidak bisa membaca pesan baru di grup ini lagi.</p>',
          onConfirm: function () {
            return api('groups.removeMember', { convId: c.conv_id, userId: target.user_id })
              .then(function () { after('Anggota dikeluarkan.'); });
          } });
      };
    });
    var leave = $('#gi-leave', dlg.el);
    if (leave) leave.onclick = function () {
      App.modal({ title: 'Keluar dari ' + c.name + '?', confirm: 'Keluar',
        body: '<p style="margin:0">' + (c.visibility === 'public' ? 'Anda bisa bergabung lagi kapan saja.' : 'Anda perlu diundang admin grup untuk masuk lagi.') + '</p>',
        onConfirm: function () {
          return api('groups.leave', { convId: c.conv_id }).then(function () {
            App.chat = null; st = null; App.toast('Anda keluar dari grup.'); App.go('chat'); App.syncNow();
          });
        } });
    };
    var edit = $('#gi-edit', dlg.el);
    if (edit) edit.onclick = function () {
      App.modal({
        title: 'Ubah info grup', confirm: 'Simpan',
        body: '<div class="field"><label>Nama grup</label><input class="input" name="name" maxlength="60" value="' + esc(c.name) + '" required></div>' +
          '<div class="field"><label>Deskripsi</label><textarea class="input" name="description" maxlength="300">' + esc(c.description) + '</textarea></div>' +
          '<div class="field"><label>Jenis grup</label><select class="input" name="visibility">' +
          '<option value="public"' + (c.visibility === 'public' ? ' selected' : '') + '>Publik — siapa pun bisa bergabung</option>' +
          '<option value="private"' + (c.visibility === 'private' ? ' selected' : '') + '>Privat — hanya lewat undangan</option></select></div>',
        onConfirm: function (f) {
          return api('groups.update', { convId: c.conv_id, name: f.name, description: f.description, visibility: f.visibility })
            .then(function () { after('Info grup disimpan.'); });
        }
      });
    };
    var photo = $('#gi-photo', dlg.el);
    if (photo) photo.onchange = function () {
      var file = this.files[0];
      if (!file) return;
      App.resizeSquare(file, 256).then(function (dataUrl) {
        return api('groups.setPhoto', { convId: c.conv_id, dataUrl: dataUrl });
      }).then(function (res) {
        App.avatarCache[res.photo_file_id] = res.dataUrl;
        after('Foto grup diperbarui.');
      }).catch(fail);
    };
    var add = $('#gi-add', dlg.el);
    if (add) add.onclick = function () { addMembersDialog(c); };
  }

  function muteBox(c) {
    return '<label class="check mute-box"><input type="checkbox" id="if-mute"' + (c.muted ? ' checked' : '') + '> ' +
      'Bisukan percakapan ini <span class="muted small">— tanpa pop-up & tidak dihitung di badge Chat</span></label>';
  }

  function bindMute(root, c) {
    var cb = $('#if-mute', root);
    if (!cb) return;
    cb.onchange = function () {
      var on = cb.checked;
      api('chat.mute', { convId: c.conv_id, muted: on }).then(function () {
        c.muted = on;
        App.toast(on ? 'Percakapan dibisukan.' : 'Notifikasi percakapan diaktifkan lagi.');
        App.syncNow();
      }).catch(function (err) { cb.checked = !on; App.toast(err.message, 'error'); });
    };
  }

  function addMembersDialog(c) {
    var chosen = {};
    var existing = {};
    c.members.forEach(function (m) { existing[m.user_id] = true; });
    var dlg = App.dialog({
      title: 'Tambah anggota ke ' + c.name,
      body: '<input class="input" id="am-q" placeholder="Cari nama, username, atau NIM"><div class="pick-list" id="am-list"></div>',
      footer: '<button class="btn btn-primary" id="am-ok" disabled>Tambahkan</button>'
    });
    var t = null;
    var updateBtn = function () {
      var n = Object.keys(chosen).length;
      $('#am-ok').disabled = !n;
      $('#am-ok').textContent = n ? 'Tambahkan (' + n + ')' : 'Tambahkan';
    };
    var load = function () {
      var box = $('#am-list');
      api('members.list', { q: $('#am-q').value }).then(function (d) {
        var items = d.items.filter(function (m) { return !existing[m.user_id]; });
        box.innerHTML = items.length ? items.map(function (m) {
          return '<label class="pick-item"><input type="checkbox" data-u="' + esc(m.user_id) + '"' + (chosen[m.user_id] ? ' checked' : '') + '>' +
            App.avatar(m, 34) + '<span class="meta"><b>' + esc(m.full_name) + '</b><small>@' + esc(m.username) + ' · Angkatan ' +
            esc(m.angkatan) + ' · Kelas ' + esc(m.kelas) + '</small></span></label>';
        }).join('') : '<div class="empty small">Semua anggota yang cocok sudah ada di grup.</div>';
        $$('[data-u]', box).forEach(function (cb) {
          cb.onchange = function () { if (cb.checked) chosen[cb.dataset.u] = true; else delete chosen[cb.dataset.u]; updateBtn(); };
        });
        App.hydrateAvatars(box);
      }).catch(function (err) { box.innerHTML = '<div class="alert alert-error">' + esc(err.message) + '</div>'; });
    };
    $('#am-q').oninput = function () { clearTimeout(t); t = setTimeout(load, 350); };
    $('#am-ok').onclick = function () {
      var b = this;
      App.busy(b, true);
      api('groups.addMembers', { convId: c.conv_id, userIds: Object.keys(chosen) }).then(function (r) {
        dlg.close();
        App.toast(r.added + ' anggota ditambahkan.', 'success');
        refreshMeta(true); App.syncNow();
      }).catch(function (err) { App.busy(b, false); App.toast(err.message, 'error'); });
    };
    load();
  }

  /** Perkecil & potong tengah jadi persegi (dipakai foto grup). */
  App.resizeSquare = function (file, size) {
    return new Promise(function (resolve, reject) {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return reject({ message: 'Pilih gambar JPG, PNG, atau WEBP.' });
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject({ message: 'File bukan gambar yang valid.' }); };
        img.onload = function () {
          var s = Math.min(img.width, img.height), c = document.createElement('canvas');
          c.width = size; c.height = size;
          var g = c.getContext('2d');
          g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
          g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  };

  /* =================== Halaman Grup =================== */
  var gTab = 'mine';

  function viewGroups(main) {
    api('groups.list').then(function (d) {
      var mine = d.items.filter(function (g) { return g.my_role; });
      var explore = d.items.filter(function (g) { return !g.my_role; });
      var card = function (g) {
        return '<div class="card group-card">' +
          '<div style="display:flex;gap:14px;align-items:center">' + App.avatar({ full_name: g.name, photo_file_id: g.photo_file_id }, 52, false, true) +
          '<div style="min-width:0"><h2 class="ellipsis">' + esc(g.name) + '</h2><div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">' +
          (g.is_official ? '<span class="chip chip-blue">Resmi</span>' : '') +
          '<span class="chip">' + (g.visibility === 'public' ? 'Publik' : 'Privat') + '</span>' +
          '<span class="chip">' + g.member_count + ' anggota</span></div></div></div>' +
          '<p class="muted group-desc">' + esc(g.description || 'Belum ada deskripsi.') + '</p>' +
          (g.my_role ? '<button class="btn btn-block" data-open="' + esc(g.conv_id) + '">Buka percakapan</button>'
            : '<button class="btn btn-primary btn-block" data-join="' + esc(g.conv_id) + '">Gabung</button>') + '</div>';
      };
      var render = function () {
        var list = gTab === 'mine' ? mine : explore;
        $('#g-grid').innerHTML = list.length ? '<div class="group-grid">' + list.map(card).join('') + '</div>'
          : '<div class="card"><div class="empty">' + ic('people', 26) + '<p>' + (gTab === 'mine'
            ? 'Anda belum bergabung ke grup mana pun. Lihat tab <b>Jelajahi</b>.' : 'Tidak ada grup publik lain untuk diikuti.') + '</p></div></div>';
        $$('.tab', main).forEach(function (t) { t.classList.toggle('active', t.dataset.tab === gTab); });
        $$('[data-open]', main).forEach(function (b) { b.onclick = function () { App.go('chat/' + b.dataset.open); }; });
        $$('[data-join]', main).forEach(function (b) {
          b.onclick = function () {
            App.busy(b, true);
            api('groups.join', { convId: b.dataset.join }).then(function (r) {
              App.toast('Berhasil bergabung.', 'success'); App.syncNow(); App.go('chat/' + r.conv_id);
            }).catch(function (err) { App.busy(b, false); App.toast(err.message, 'error'); });
          };
        });
        App.hydrateAvatars(main);
      };
      main.innerHTML = '<div class="main-inner"><div class="page-head"><div><h1>Grup</h1><p>Ruang diskusi per kelas, angkatan, dan minat belajar.</p></div>' +
        (d.canCreate ? '<button class="btn btn-primary" id="g-create">+ Buat grup</button>' : '') + '</div>' +
        '<div class="tabs"><a class="tab" data-tab="mine">Grup saya (' + mine.length + ')</a><a class="tab" data-tab="explore">Jelajahi (' + explore.length + ')</a></div>' +
        '<div id="g-grid"></div>' +
        (d.canCreate ? '' : '<p class="muted small" style="margin-top:18px">Ingin membuat grup baru? Ajukan ke Moderator atau Admin.</p>') + '</div>';
      $$('.tab', main).forEach(function (t) { t.onclick = function () { gTab = t.dataset.tab; render(); }; });
      var cb = $('#g-create');
      if (cb) cb.onclick = function () { createGroupDialog(d.canOfficial); };
      render();
    }).catch(function (err) {
      main.innerHTML = '<div class="main-inner"><div class="alert alert-error">' + esc(err.message) + '</div></div>';
    });
  }

  function createGroupDialog(canOfficial) {
    if (canOfficial === undefined) canOfficial = ['super_admin', 'admin'].indexOf(App.me.role) >= 0;
    App.modal({
      title: 'Buat grup baru', confirm: 'Buat grup',
      body: '<div class="field"><label>Nama grup</label><input class="input" name="name" maxlength="60" placeholder="mis. TOEFL Preparation" required></div>' +
        '<div class="field"><label>Deskripsi <span class="muted">(opsional)</span></label><textarea class="input" name="description" maxlength="300" placeholder="Tujuan grup, jadwal, aturan singkat"></textarea></div>' +
        '<div class="field"><label>Jenis grup</label><select class="input" name="visibility">' +
        '<option value="public">Publik — siapa pun bisa bergabung</option><option value="private">Privat — hanya lewat undangan</option></select></div>' +
        (canOfficial ? '<label class="check"><input type="checkbox" name="is_official"> Grup resmi (kelas/angkatan/organisasi)</label>' : ''),
      onConfirm: function (f) {
        return api('groups.create', { name: f.name, description: f.description, visibility: f.visibility, is_official: !!f.is_official })
          .then(function (r) { App.toast('Grup dibuat. Tambahkan anggota lewat tombol Info.', 'success'); App.syncNow(); App.go('chat/' + r.conv_id); });
      }
    });
  }

  /* =================== Notifikasi =================== */
  var NOTIF_ICON = { group_added: 'people', group_removed: 'back', group_admin: 'check', welcome: 'send', role: 'info' };

  function viewNotifications(main) {
    var page = 1, items = [];
    var load = function () {
      api('notifications.list', { page: page }).then(function (d) {
        items = items.concat(d.items);
        main.innerHTML = '<div class="main-inner" style="max-width:760px"><div class="page-head"><div><h1>Notifikasi</h1><p>' +
          (d.unread ? d.unread + ' belum dibaca' : 'Semua sudah dibaca') + '</p></div>' +
          (d.unread ? '<button class="btn" id="n-all">' + ic('checks', 16) + ' Tandai semua dibaca</button>' : '') + '</div>' +
          '<div class="card">' + (items.length ? items.map(function (n) {
            return '<a class="notif-item' + (n.is_read ? '' : ' unread') + '" data-id="' + esc(n.id) + '" data-link="' + esc(n.link) + '">' +
              '<span class="notif-ic">' + ic(NOTIF_ICON[n.type] || 'info', 18) + '</span><span class="meta"><span class="t">' + esc(n.title) +
              '</span><small>' + esc(App.timeAgo(n.created_at)) + '</small></span>' + (n.is_read ? '' : '<span class="udot"></span>') + '</a>';
          }).join('') : '<div class="empty">' + ic('info', 24) + '<p>Belum ada notifikasi.</p></div>') + '</div>' +
          (d.total > items.length ? '<div class="pager"><button class="btn btn-sm" id="n-more">Muat lagi</button></div>' : '') + '</div>';
        $$('[data-id]', main).forEach(function (a) {
          a.onclick = function () {
            api('notifications.markRead', { ids: [a.dataset.id] }).then(function () { App.syncNow(); }).catch(function () {});
            if (a.dataset.link) App.go(a.dataset.link); else a.classList.remove('unread');
          };
        });
        var all = $('#n-all');
        if (all) all.onclick = function () {
          App.busy(all, true);
          api('notifications.markRead', { all: true }).then(function () { App.syncNow(); page = 1; items = []; load(); })
            .catch(function (err) { App.busy(all, false); App.toast(err.message, 'error'); });
        };
        var more = $('#n-more');
        if (more) more.onclick = function () { page++; load(); };
      }).catch(function (err) {
        main.innerHTML = '<div class="main-inner"><div class="alert alert-error">' + esc(err.message) + '</div></div>';
      });
    };
    load();
  }

  App.routes.chat = { title: 'Chat', view: viewChat };
  App.routes.groups = { title: 'Grup', view: viewGroups };
  App.routes.notifications = { title: 'Notifikasi', view: viewNotifications };
})();
</script>
